<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La veille de Matthieu</title>
<link rel="alternate" type="application/rss+xml" title="La veille de Matthieu" href="feed.xml">
<style>
:root{--bg:#f7f5f0;--ink:#17181a;--muted:#6b6f76;--line:#dcd7cc;--accent:#b4442b;--card:#fffdf8;--soft:#f0ece2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto}
header{padding:44px 22px 24px;border-bottom:1px solid var(--line)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1.1;margin:0 0 8px;letter-spacing:-.5px}
.tagline{color:var(--muted);font-size:15px;margin:0}
.meta{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}
main{padding:24px 22px 60px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.wlabel{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:14px 0 6px}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px;margin:6px 0 24px}
article.ed{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:22px}
.edhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.edlabel{font-family:Georgia,serif;font-size:19px}
.edsub{color:var(--muted);font-size:12.5px}
.edtag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 9px;white-space:nowrap}
.retenir{background:var(--soft);border-left:3px solid var(--accent);padding:13px 15px;border-radius:0 8px 8px 0;margin-bottom:20px}
.retenir .k,.note .k{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--accent);margin-bottom:5px}
.retenir p{margin:0;font-size:15px}
ol.items{list-style:none;margin:0;padding:0}
li.it{padding:13px 0;border-top:1px solid var(--line)}
li.it:first-child{border-top:0;padding-top:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.rub{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.heure{font-size:11px;color:var(--muted)}
.cert{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted)}
.cert.declaration{background:#fbece7;color:#9d3a22}
a.t{color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;display:block;margin-bottom:4px}
a.t:hover{color:var(--accent)}
.res{margin:0;color:#3f4348;font-size:14px}
.tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--muted);background:#f3efe6;border-radius:4px;padding:1px 7px}
.tag.watch{color:var(--accent);background:#fbece7}
.note{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.note textarea{width:100%;min-height:52px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:13.5px;background:#fff;resize:vertical}
.empty{color:var(--muted);font-size:14px}
footer{border-top:1px solid var(--line);padding:18px 22px 40px;color:var(--muted);font-size:12.5px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap">
<p class="meta">Veille quotidienne</p>
<h1>La veille de Matthieu</h1>
<p class="tagline">Retail et retail media, mobilité électrique, IA appliquée</p>
</div></header>
<main><div class="wrap">
<div class="controls" id="chips"></div>
<div class="wlabel">Acteurs suivis</div>
<div class="controls" id="watch"></div>
<input type="search" id="q" placeholder="Rechercher un titre, un acteur, un mot-clé">
<div id="editions"><p class="empty">La veille arrive.</p></div>
</div></main>
<footer><div class="wrap">
<a href="feed.xml">Flux RSS</a> &middot; <a href="https://github.com/mthiriez/veille">Source et historique</a>
</div></footer>
<script>
var EDITIONS=[], WATCH=[], RUB="Toutes", ACT="", Q="";
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function renderChips(){
  var rubs=["Toutes"];EDITIONS.forEach(function(e){e.items.forEach(function(i){if(rubs.indexOf(i.rubrique)<0)rubs.push(i.rubrique);});});
  document.getElementById("chips").innerHTML=rubs.map(function(r){
    return '<button class="chip" data-rub="'+esc(r)+'" aria-pressed="'+(r===RUB)+'">'+esc(r)+"</button>";}).join("");
  document.getElementById("watch").innerHTML=WATCH.map(function(a){
    return '<button class="chip" data-act="'+esc(a)+'" aria-pressed="'+(a===ACT)+'">'+esc(a)+"</button>";}).join("");
}
function match(i){
  if(RUB!=="Toutes" && i.rubrique!==RUB) return false;
  if(ACT && (i.acteurs||[]).indexOf(ACT)<0) return false;
  if(Q){var h=norm([i.titre,i.resume,i.rubrique,(i.acteurs||[]).join(" ")].join(" "));if(h.indexOf(norm(Q))<0)return false;}
  return true;
}
function render(){
  var host=document.getElementById("editions"),out="";
  EDITIONS.forEach(function(e){
    var its=e.items.filter(match);
    if(!its.length && (Q||ACT)) return;
    var key="veille-note-"+encodeURIComponent(e.label);
    out+='<article class="ed"><div class="edhead"><div><div class="edlabel">'+esc(e.label)+'</div>'+
      (e.periode?'<div class="edsub">'+esc(e.periode)+'</div>':"")+'</div>'+
      '<span class="edtag">'+esc(e.type==="hebdo"?"Synthèse hebdo":"Quotidien")+'</span></div>';
    if(e.a_retenir) out+='<div class="retenir"><span class="k">À retenir</span><p>'+esc(e.a_retenir)+"</p></div>";
    out+='<ol class="items">';
    its.forEach(function(i){
      out+='<li class="it"><div class="row"><span class="rub">'+esc(i.rubrique)+'</span><span class="heure">'+esc(i.heure)+"</span>"+
        (i.certitude?'<span class="cert '+(i.certitude==="déclaration"?"declaration":"")+'">'+esc(i.certitude)+"</span>":"")+"</div>"+
        '<a class="t" href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.titre)+"</a>"+
        '<p class="res">'+esc(i.resume)+"</p>";
      if((i.acteurs||[]).length){
        out+='<div class="tags">'+i.acteurs.map(function(a){
          var w=WATCH.indexOf(a)>=0?' watch':'';
          return '<span class="tag'+w+'">'+esc(a)+"</span>";}).join("")+"</div>";
      }
      out+="</li>";
    });
    out+="</ol>";
    out+='<div class="note"><span class="k">Votre note</span><textarea data-key="'+esc(key)+'" placeholder="Ce que vous voulez retenir"></textarea></div>';
    out+="</article>";
  });
  host.innerHTML=out||'<p class="empty">Aucun titre ne correspond à ce filtre.</p>';
  host.querySelectorAll("textarea[data-key]").forEach(function(t){
    try{t.value=localStorage.getItem(t.dataset.key)||"";}catch(e){}
    t.addEventListener("input",function(){try{localStorage.setItem(t.dataset.key,t.value);}catch(e){}});
  });
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("button.chip");if(!b)return;
  if(b.dataset.rub){RUB=b.dataset.rub;}else{ACT=(ACT===b.dataset.act)?"":b.dataset.act;}
  renderChips();render();
});
document.getElementById("q").addEventListener("input",function(e){Q=e.target.value;render();});
fetch("editions.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
  EDITIONS=d.editions||[];WATCH=d.watchlist||[];renderChips();render();
}).catch(function(){document.getElementById("editions").innerHTML='<p class="empty">La veille arrive.</p>';});
</script>
</body>
</html>
